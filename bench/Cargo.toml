# Published as `sextant-bench` because the bare name `bench` is not available on
# crates.io and the CLI (`sextant-re`) depends on this crate, so it must be a
# real, versioned registry dependency. The library and binary keep the short
# `bench` name, so source code and `sextant bench` are unchanged.
[package]
name = "sextant-bench"
description = "Evaluation and benchmark harness for the Sextant ground-truth corpus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "bench"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sextant-engine.workspace = true
sextant-ir.workspace = true

[lints]
workspace = true

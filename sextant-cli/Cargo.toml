# Published as `sextant-re` because the bare name `sextant` is already taken on
# crates.io by an unrelated celestial-navigation crate. The installed binary is
# still named `sextant`, so users run `cargo install sextant-re` and then invoke
# `sextant`. See docs/RELEASING.md for the naming rationale.
[package]
name = "sextant-re"
description = "Sextant: infer and verify the structure of unknown binary formats and protocols. Installs the `sextant` command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[[bin]]
name = "sextant"
path = "src/main.rs"

[dependencies]
clap.workspace = true
sextant-engine.workspace = true
sextant-export.workspace = true
# The benchmark harness, published as `sextant-bench` (its library name stays
# `bench`). The CLI wires `sextant bench` to it so the published accuracy
# numbers and the command-line benchmark share one implementation (PRD
# Section 15).
sextant-bench.workspace = true
# The model layer, with its network providers. Optional: only the `llm`
# feature links it, so a default build contains no network code at all and
# `infer` cannot send anything whatever the flags (NFR-4).
sextant-llm = { workspace = true, optional = true }

[dev-dependencies]
# Reads the reports the model-path tests write.
serde_json.workspace = true

[features]
default = []
# Compile the Anthropic, OpenAI, and Ollama providers so `infer --provider`
# can consult a model. Release builds enable it; without `--provider` no
# provider is ever constructed.
llm = [
    "dep:sextant-llm",
    "sextant-llm/anthropic",
    "sextant-llm/openai",
    "sextant-llm/ollama",
]

[lints]
workspace = true

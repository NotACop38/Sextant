[package]
name = "sextant-cli"
description = "The sextant command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sextant"
path = "src/main.rs"

[dependencies]
clap.workspace = true
sextant-engine.workspace = true
sextant-export.workspace = true
# The benchmark harness is an internal, non-published workspace crate. The CLI
# wires `sextant bench` to it so the published accuracy numbers and the
# command-line benchmark share one implementation (PRD Section 15).
bench = { path = "../bench" }

[lints]
workspace = true

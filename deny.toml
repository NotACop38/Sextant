# cargo-deny configuration for Sextant.
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# The advisory database is fetched from its default source. Security
# vulnerabilities fail the check. List specific advisory ids here to ignore one
# with a written justification.
yanked = "warn"
ignore = []

[licenses]
# Permissive licenses compatible with this project's MIT or Apache-2.0 license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# Several permissive licenses are allowed ahead of need, for dependencies added
# in later steps. Do not warn when one of them is not currently in the tree.
unused-allowed-license = "allow"

# webpki-roots ships Mozilla's trusted root certificate set, which is published
# under the Community Data License Agreement Permissive 2.0. It is a permissive,
# non-copyleft data license. The crate is pulled in only by the optional network
# providers in sextant-llm (the `anthropic`, `openai`, and `ollama` features) and
# is never on the default build or the offline `--no-llm` path. The exception is
# scoped to this one crate rather than allowing the license globally.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
# Duplicate dependency versions are reported but do not fail the build yet.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

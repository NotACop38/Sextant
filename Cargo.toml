[workspace]
resolver = "3"
members = [
    "sextant-ir",
    "sextant-engine",
    "sextant-llm",
    "sextant-export",
    "sextant-cli",
    "bench",
]
# The fuzz crate depends on libfuzzer-sys and builds only on nightly with the
# `cargo fuzz` tooling, so it is kept out of the stable workspace build.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NotACop38/Sextant"
homepage = "https://github.com/NotACop38/Sextant"
authors = ["The Sextant contributors"]
description = "Infers the structure of unknown binary formats and protocols from samples and emits verified parsers."
keywords = ["reverse-engineering", "binary", "parser", "protocol", "kaitai"]
categories = ["command-line-utilities", "parser-implementations", "development-tools"]

[workspace.dependencies]
bitvec = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sextant-ir = { path = "sextant-ir", version = "0.1.0" }
sextant-engine = { path = "sextant-engine", version = "0.1.0" }
sextant-llm = { path = "sextant-llm", version = "0.1.0" }
sextant-export = { path = "sextant-export", version = "0.1.0" }
sextant-bench = { path = "bench", version = "0.1.0" }

[workspace.lints.rust]
# The parsing core handles untrusted input, so unsafe is denied by default
# (NFR-1). Any exception requires a written justification and a covering test.
unsafe_code = "deny"

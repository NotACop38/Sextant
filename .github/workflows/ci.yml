name: CI

# Every third-party action is pinned to a full commit SHA, with the release it
# corresponds to in a trailing comment, so a moved tag cannot change what runs.
# Every checkout sets `persist-credentials: false`: no job pushes, so none keeps
# the token in the local git config where later steps could read it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  docs:
    name: API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Build the API docs with warnings as errors
        # Broken or ambiguous intra-doc links fail the build, so the published
        # API documentation cannot silently lose its cross-references.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  build-test:
    # Sextant ships on Linux, macOS, and Windows (NFR-5), so the build, the
    # clippy lints, the test suite, and the benchmark regression guard all run
    # on every supported platform.
    name: Build, test, and lint
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --all-targets --all-features --verbose
      - name: Release build
        run: cargo build --release
      - name: Test
        run: cargo test --workspace --all-features --verbose
      - name: Benchmark regression guard
        # Fail the build if any accuracy metric drops below its configured
        # threshold (PRD Section 15). This runs the same harness that generates
        # the README numbers, statistics-only and fully offline.
        run: cargo run -p sextant-bench -- --check
      - name: Examples against the release build
        # Run the documented examples end to end with the release binary, so a
        # CLI change (for example to where `--out` may write) cannot silently
        # break them again. record_demo.py exits non-zero if any recorded
        # command fails, so error text can never be recorded into the demo;
        # the cast it rewrites here is discarded with the runner.
        if: runner.os == 'Linux'
        run: |
          ./examples/quickstart.sh
          python3 examples/record_demo.py

  export-runtimes:
    name: Export runtime verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Kaitai compiler and runtime, plus Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python3 -m pip install kaitaistruct==0.11
          curl -fL https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler-0.11.zip -o "$RUNNER_TEMP/kaitai.zip"
          echo "ff89389d9dc9e770d78a24af328763cb1f8e7b31ce7766c9edf10669a060f2a2  $RUNNER_TEMP/kaitai.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/kaitai.zip" -d "$RUNNER_TEMP/kaitai"
          echo "$RUNNER_TEMP/kaitai/kaitai-struct-compiler-0.11/bin" >> "$GITHUB_PATH"
      - name: Require external runtime tests
        env:
          SEXTANT_REQUIRE_KAITAI: '1'
          SEXTANT_REQUIRE_LUA: '1'
        run: cargo test -p sextant-export

  cargo-deny:
    name: Licenses and advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run cargo-deny
        # This action release runs cargo-deny 0.20.2 with `--all-features`,
        # the same graph deny.toml's `[graph]` section selects for local runs.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  cargo-audit:
    name: Security advisories (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install cargo-audit
        # A prebuilt binary, so the audit tool's own toolchain requirement stays
        # independent of the project's pinned MSRV. The tool version is pinned
        # too; bump it deliberately.
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit@0.22.2
      - name: Audit the workspace dependencies
        # Checks the committed Cargo.lock against the RustSec advisory database
        # (NFR-10). The fuzz crate keeps its own lockfile for its nightly-only
        # tooling, so it is audited too.
        run: |
          cargo audit
          cargo audit --file fuzz/Cargo.lock

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  build-test:
    # Sextant ships on Linux, macOS, and Windows (NFR-5), so the build, the
    # clippy lints, the test suite, and the benchmark regression guard all run
    # on every supported platform.
    name: Build, test, and lint
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --all-targets --all-features --verbose
      - name: Release build
        run: cargo build --release
      - name: Test
        run: cargo test --workspace --all-features --verbose
      - name: Benchmark regression guard
        # Fail the build if any accuracy metric drops below its configured
        # threshold (PRD Section 15). This runs the same harness that generates
        # the README numbers, statistics-only and fully offline.
        run: cargo run -p sextant-bench -- --check

  export-runtimes:
    name: Export runtime verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Kaitai compiler and runtime, plus Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python3 -m pip install kaitaistruct==0.11
          curl -fL https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler-0.11.zip -o "$RUNNER_TEMP/kaitai.zip"
          echo "ff89389d9dc9e770d78a24af328763cb1f8e7b31ce7766c9edf10669a060f2a2  $RUNNER_TEMP/kaitai.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/kaitai.zip" -d "$RUNNER_TEMP/kaitai"
          echo "$RUNNER_TEMP/kaitai/kaitai-struct-compiler-0.11/bin" >> "$GITHUB_PATH"
      - name: Require external runtime tests
        env:
          SEXTANT_REQUIRE_KAITAI: '1'
          SEXTANT_REQUIRE_LUA: '1'
        run: cargo test -p sextant-export

  cargo-deny:
    name: Licenses and advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  cargo-audit:
    name: Security advisories (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        # A prebuilt binary, so the audit tool's own toolchain requirement stays
        # independent of the project's pinned MSRV.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit the workspace dependencies
        # Checks the committed Cargo.lock against the RustSec advisory database
        # (NFR-10). The fuzz crate keeps its own lockfile for its nightly-only
        # tooling, so it is audited too.
        run: |
          cargo audit
          cargo audit --file fuzz/Cargo.lock
